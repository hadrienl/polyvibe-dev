name: Windows

# The port of #481: which modules build on Windows. A module is marked `required` by the ticket
# that ports it; until then its failure shows as a warning on a green check, so that no pull
# request looks red for a module nobody has ported yet.
on:
  push:
    # epic/winlinux gathers the Windows and Linux port (#481) until it is stable enough to ship.
    branches: [main, epic/winlinux]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: VibeDomain, required: false }
          - { target: VibeApplication, required: false }
          - { target: VibeProcess, required: false }
          - { target: VibePersistence, required: false }
          - { target: VibeGit, required: false }
          - { target: VibeAgents, required: false }
          - { target: VibeEndpoints, required: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: compnerd/gha-setup-swift@57fe462cd3c7b05ae8fcff79b00719312e305257 # main, 2026-11-16
        with:
          swift-version: swift-6.4.2-release
          swift-build: 6.4.2-RELEASE
      - name: Resolve
        working-directory: Packages/VibeManagerKit
        run: swift package resolve --force-resolved-versions
      - name: Build ${{ matrix.target }}
        id: build
        continue-on-error: ${{ !matrix.required }}
        working-directory: Packages/VibeManagerKit
        run: swift build --force-resolved-versions --build-system native --target ${{ matrix.target }}
      - name: Not ported yet
        if: steps.build.outcome == 'failure'
        shell: bash
        run: echo "::warning title=${{ matrix.target }}::Does not build on Windows yet; expected until the ticket that ports it (#481)."
