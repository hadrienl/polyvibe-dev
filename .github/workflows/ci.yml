name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The interface smoke test, on demand: it blocks a release, not a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three parts of `Scripts/ci.sh` at once, on three runners: run one after the other they took
  # past forty minutes on a slow runner. Each part's name is the check a pull request waits for.
  build-and-test:
    name: build-and-test (${{ matrix.stage }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        stage: [package, macos, companion]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.app

      # Since Xcode 26 the Metal toolchain is a separate download, and SwiftTerm compiles a shader.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      # Xcode's compilation cache is keyed by what is compiled, not by the dates a fresh checkout
      # changes: the last run's, restored, spares what did not change. Saved under each commit,
      # restored from the newest of the same part. The package's own build, by SwiftPM, has none.
      - name: Restore the compilation cache
        if: matrix.stage != 'package'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/CompilationCache
          key: compilation-xcode27-${{ matrix.stage }}-${{ github.sha }}
          restore-keys: compilation-xcode27-${{ matrix.stage }}-

      - name: Build and test
        run: Scripts/ci.sh ${{ matrix.stage }}

  # The landing page renders in every language: a missing text stops the build, and on `main` that
  # would also hold back the Sparkle feed deployed with it (Scripts/publish-appcast.sh).
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Build the site
        run: node site/build.mjs "$RUNNER_TEMP/site"

  # The nominal journey on the built application, driven by XCUITest (#19). Not on pull requests:
  # a shared runner's graphical session is not stable enough to fail a pull request over, and the
  # release checklist is where this job has to be green.
  ui-smoke:
    if: github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.app

      # Since Xcode 26 the Metal toolchain is a separate download, and SwiftTerm compiles a shader.
      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Run the interface smoke test
        run: Scripts/ui-smoke.sh

      - name: Keep the result of a failed smoke test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-result
          path: DerivedData/UISmoke/UISmoke.xcresult
          retention-days: 7
